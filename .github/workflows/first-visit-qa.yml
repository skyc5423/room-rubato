name: First visit QA only
on:
  push:
    branches: [qa/first-visit-20261119]
permissions:
  contents: read
jobs:
  guest-mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci && npm test && npm run typecheck && npm run build
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ef3d6666973fc224856cf092cc099ab5b02a5371
          path: qa-harness
          persist-credentials: false
      - run: |
          npm ci --ignore-scripts --prefix qa-harness
          node qa-harness/node_modules/playwright-core/cli.js install chromium
      - name: Local guest mobile journey and accessibility
        shell: bash
        run: |
          set -euo pipefail
          npm start -- -H 127.0.0.1 > /tmp/rubato-first-visit-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          READY=0
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/explore >/dev/null; then READY=1; break; fi
            sleep 1
          done
          test "$READY" = 1
          node scripts/qa/first-visit.cjs
